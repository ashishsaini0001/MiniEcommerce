{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniMart | Login</title>

    <link rel="stylesheet"
          href="{% static 'shop/css/style.css' %}">
</head>

<body>

<header>
    <h1>🛒 MiniMart</h1>

    <nav>
        <a href="/">Home</a>
        <a href="{% url 'cart' %}">🛒 Cart</a>
        <a href="{% url 'register' %}">Register</a>
    </nav>
</header>


<main>

    <section class="auth-section">

        <h2>Login</h2>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">
                Create Account
            </a>
        </p>

    </section>

</main>


<footer>
    <p>©️ 2026 MiniMart. All rights reserved.</p>
</footer>

</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniMart | Checkout</title>

    <link rel="stylesheet"
          href="{% static 'shop/css/Checkout.css' %}">
          
</head>

<body>

<header>
    <h1>🛒 MiniMart</h1>

    <nav>
        <a href="/">Home</a>
        <a href="{% url 'cart' %}">🛒 Cart</a>
    </nav>
</header>


<main>

    <section class="checkout-section">

        <h2>Checkout</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>

            <label>Mobile Number</label>
            <input type="tel"
                   name="mobile"
                   placeholder="Enter mobile number"
                   required>

            <label>Address</label>
            <textarea name="address"
                      placeholder="Enter your address"
                      required></textarea>

            <label>City</label>
            <input type="text"
                   name="city"
                   placeholder="Enter city"
                   required>

            <label>Pincode</label>
            <input type="text"
                   name="pincode"
                   placeholder="Enter pincode"
                   required>

            <h3>Total Amount: ₹{{ total }}</h3>

            <button type="submit">
                Place Order
            </button>

        </form>

    </section>

</main>


<footer>
    <p>©️ 2026 MiniMart. All rights reserved.</p>
</footer>

</body>
</html>
